name: CI/CD Pipeline (Build, Sec Scans, Staging, DAST & Prod)
on:
  push:
    branches: 
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STAGING_URL: ${{ vars.STAGING_URL }}

jobs:
  secret-scan:
    name: Scan de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Escaneo de Secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir Reporte Gitleaks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif # Gitleaks genera este archivo por defecto
  
  # Cambiar a "true" para debug o bypass por hallazgos
  sast-scan:
    name: Security Semgrep
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
              python-version: '3.11'

        - name: Install dependencies
          run: |
              pip install semgrep

        - name: Run Semgrep
          run: |
              semgrep ci --config=p/javascript --config=p/security-audit --json --output semgrep-report.json || true

        - name: Upload Semgrep Report
          uses: actions/upload-artifact@v4
          if: always()
          with:
              name: semgrep-report
              path: semgrep-report.json

  security-and-build:
    name: Build, SCA and Push
    needs: [sast-scan, secret-scan] 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Escaneo SCA (Dependencias) con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'json' # Modificado para generar un artefacto procesable
          output: 'trivy-fs-report.json'
          severity: 'CRITICAL,HIGH'
          # Para debuguear y permitir que el pipeline continue aunque encuentre vulnerabilidades, cambiar el valor de exit-code a 0
          exit-code: '0' 

      - name: Subir Reporte Trivy FS
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json

      - name: Login en GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Construir imagen Docker (solo local para escaneo)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Escaneo SCA (Imagen Base Docker) con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'json' # Modificado para generar un artefacto procesable
          output: 'trivy-image-report.json'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          # Para debuguear y permitir que el pipeline continue aunque encuentre vulnerabilidades, cambiar el valor de exit-code a 0
          exit-code: '0' 

      - name: Subir Reporte Trivy Image
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image-report.json

      - name: Pushear imagen Docker
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    name: Despliegue a Stagging
    needs: security-and-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Actualizar versión en manifiesto Kubernetes
        run: |
          NUEVA_IMAGEN="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          sed -i "s|image: .*|image: $NUEVA_IMAGEN|g" kubernetes-deployment-staging.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes-deployment-staging.yaml
          git commit -m "Bump de version de imagen a sha-${{ github.sha }} en stagging [skip ci]" || echo "No hubo cambios"
          git push origin master

      - name: Trigger Portainer STAGING Webhook
        run: |
          curl -X POST \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.PORTAINER_WEBHOOK_STAGING }}"

  dast-scan:
    name: Scan DAST (OWASP ZAP)
    needs: deploy-staging 
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que el despliegue de Staging termine
        run: |
          echo "Dando 45 segundos para que K8s y Portainer levanten la nueva versión en Staging..."
          sleep 45 

      - name: Ejecutar ZAP DAST en Docker con Cloudflare Access
        env:
          DAST_TARGET_URL: ${{ env.STAGING_URL }}
          CF_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          test -n "${DAST_TARGET_URL}" || (echo "Falta DAST_TARGET_URL" && exit 1)
          test -n "${CF_CLIENT_ID}" || (echo "Falta CF_CLIENT_ID" && exit 1)
          test -n "${CF_CLIENT_SECRET}" || (echo "Falta CF_CLIENT_SECRET" && exit 1)
          
          mkdir -p reports
          chmod 777 reports
          
          docker run --rm \
            -v "$(pwd)/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "${DAST_TARGET_URL}" \
            -x zap-report.xml \
            -r zap-report.html \
            -I \
            -z "-config replacer.full_list(0).description=CF_ID -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=req_header \ 
            -config replacer.full_list(0).matchstr=CF-Access-Client-Id -config replacer.full_list(0).regex=false \
            -config replacer.full_list(0).replacement=${CF_CLIENT_ID} -config replacer.full_list(1).description=CF_SECRET \
            -config replacer.full_list(1).enabled=true -config replacer.full_list(1).matchtype=req_header \
            -config replacer.full_list(1).matchstr=CF-Access-Client-Secret -config replacer.full_list(1).regex=false \
            -config replacer.full_list(1).replacement=${CF_CLIENT_SECRET}" || true

          HIGH=$(grep -o 'riskcode="3"' reports/zap-report.xml | wc -l | tr -d ' ')
          CRIT=$(grep -o 'riskcode="4"' reports/zap-report.xml | wc -l | tr -d ' ')
          echo "High: ${HIGH}"
          echo "Critical: ${CRIT}"
          if [ "${HIGH}" -gt 0 ] || [ "${CRIT}" -gt 0 ]; then
            echo "DAST failed: se encontraron hallazgos High/Critical"
            exit 1
          fi

      - name: Subir Reportes DAST como Artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: |
            reports/zap-report.xml
            reports/zap-report.html
       
  deploy-prod:
    name: Despliegue a Produccion
    needs: dast-scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Actualizar versión en manifiesto Kubernetes
        run: |
          NUEVA_IMAGEN="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          sed -i "s|image: .*|image: $NUEVA_IMAGEN|g" kubernetes-deployment.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull
          git add kubernetes-deployment.yaml
          git commit -m "Bump de version de imagen a sha-${{ github.sha }} en produccion [skip ci]" || echo "No hubo cambios"
          git push origin master
      - name: Trigger Portainer PROD Webhook
        run: |
          curl -X POST \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.PORTAINER_WEBHOOK_URL }}"