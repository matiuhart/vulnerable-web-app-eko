name: CI/CD Pipeline (Build, Sec Scans, Staging, DAST & Prod)
on:
  push:
    branches: 
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STAGING_URL: ${{ vars.STAGING_URL }}
  PORTAINER_WEBHOOK_STAGING: ${{ secrets.PORTAINER_WEBHOOK_URL_STAGING }}
  PORTAINER_WEBHOOK_PROD: ${{ secrets.PORTAINER_WEBHOOK_URL_PROD }}

jobs:
  secret-scan:
    name: Scan de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Escaneo de Secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Escaneo SAST con Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/security-audit
            p/secrets
          # Cambiar a "1" para debug o bypass por hallazgos
        env:
          SEMGREP_EXIT_CODE: "0" # Deshabilitado para evitar stop de pipeline

  security-and-build:
    name: Build, SCA and Push
    needs: [sast-scan, secret-scan] 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Escaneo SCA (Dependencias) con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          # Para debuguear y permitir que el pipeline continue aunque encuentre vulnerabilidades, cambiar el valor de exit-code a 0
          exit-code: '1' 

      - name: Login en GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Construir imagen Docker (solo local para escaneo)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Escaneo SCA (Imagen Base Docker) con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          # Para debuguear y permitir que el pipeline continue aunque encuentre vulnerabilidades, cambiar el valor de exit-code a 0
          exit-code: '1' 

      - name: Pushear imagen Docker
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    name: Despliegue a Staging
    needs: security-and-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Actualizar versión en manifiesto Kubernetes
        run: |
          NUEVA_IMAGEN="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          sed -i "s|image: .*|image: $NUEVA_IMAGEN|g" kubernetes-deployment-stagging.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes-deployment-stagging.yaml
          git commit -m "Bump de version de imagen a sha-${{ github.sha }} [skip ci]" || echo "No hubo cambios"
          git push origin master

      - name: Trigger Portainer STAGING Webhook
        run: |
          curl -X POST \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ env.PORTAINER_WEBHOOK_STAGING }}"

  dast-scan:
    name: Scan DAST (OWASP ZAP)
    needs: deploy-staging 
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que el despliegue de Staging termine
        run: |
          echo "Dando 45 segundos para que K8s y Portainer levanten la nueva versión en Staging..."
          sleep 45 

      - name: Escaneo DAST con OWASP ZAP (Baseline)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.STAGING_URL }}
          # Setear en "false" para debug y bypass de fallo por hallazgos
          fail_action: false

  deploy-prod:
    name: Despliegue a Produccion
    needs: dast-scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer PROD Webhook
        run: |
          curl -X POST \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ env.PORTAINER_WEBHOOK_PROD }}"