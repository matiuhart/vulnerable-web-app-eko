---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  labels:
    app: vulnerable-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
    spec:
      containers:
      - name: vulnerable-app
        image: ghcr.io/matiuhart/vulnerable-web-app-eko:sha-a26f855677bb16a181966fae53d74d102b68aa4e
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NODE_ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-app-svc
  labels:
    app: vulnerable-app
spec:
  type: NodePort
  selector:
    app: vulnerable-app
  ports:
    - port: 9080
      targetPort: 8080
      protocol: TCP
      name: http